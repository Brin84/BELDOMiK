<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Позвонить</title>
  <script>
    // Мгновенный запуск системного набора. Страница открывается через
    // WebApp.openLink() в SFSafariViewController, где tel: НЕ блокируется
    // (в отличие от WebView MiniApp). Пытаемся уйти на tel: сразу, до отрисовки —
    // чтобы над Safari успел всплыть нативный диалог iOS «Позвонить <номер>».
    (function () {
      var phone = new URLSearchParams(location.search).get('phone');
      if (!phone || !/^\+?\d[\d\s()\-]{6,20}$/.test(phone)) return;
      var href = 'tel:' + phone.replace(/[^\d+]/g, '');
      function tryDial() {
        // Несколько способов — какой-нибудь из них Safari отдаст системе.
        try { location.replace(href); } catch (e) {}
        try { window.location.href = href; } catch (e) {}
      }
      tryDial();                                       // сразу, до body
      document.addEventListener('DOMContentLoaded', tryDial); // резерв после DOM
    })();
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 32px;
      background: #ffffff;
      color: #1a1a1a;
      text-align: center;
    }
    .state--busy { perspective: 600px; }
    .state--busy { display: flex; }
    .phone-ico {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #34c759;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(52, 199, 89, 0.4);
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .phone-ico svg { width: 30px; height: 30px; }
    .state__text { font-size: 15px; font-weight: 600; color: #3c3c43; }
    .state__number {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.01em;
      font-variant-numeric: tabular-nums;
      word-break: break-word;
    }
    .state__btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 54px;
      min-width: 260px;
      max-width: 320px;
      width: 100%;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    .state__btn--call {
      background: #34c759;
      color: #fff;
      box-shadow: 0 6px 18px rgba(52, 199, 89, 0.35);
    }
    .state__btn--copy {
      background: #eef4ff;
      color: #2171ee;
    }
    .state__hint { font-size: 13px; color: #8e8e93; }
  </style>
</head>
<body>
  <div class="phone-ico" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
    </svg>
  </div>
  <div class="state__number" id="number"></div>
  <a id="call" class="state__btn state__btn--call" href="">
    📞 Позвонить
  </a>
  <button id="copy" class="state__btn state__btn--copy" type="button">
    📋 Скопировать номер
  </button>
  <p class="state__hint">Нажмите «Позвонить», если набор не запустился автоматически</p>

  <noscript>
    <a href="" id="noscript-call" style="color:#34c759;font-size:20px;font-weight:700">Позвонить</a>
  </noscript>

  <script>
    // Если автозапуск tel: заблокирован (некоторые сборки iOS требуют жест) —
    // страница остаётся на месте: кнопка «Позвонить» уже на экране, тап = жест.
    var phone = new URLSearchParams(location.search).get('phone');
    var valid = phone && /^\+?\d[\d\s()\-]{6,20}$/.test(phone);
    if (valid) {
      var href = 'tel:' + phone.replace(/[^\d+]/g, '');
      document.getElementById('number').textContent = phone;
      var call = document.getElementById('call');
      call.href = href;
      call.addEventListener('click', function () { location.href = href; });
      document.getElementById('copy').addEventListener('click', function () {
        navigator.clipboard.writeText(phone).then(function () {
          document.getElementById('copy').textContent = '✓ Скопировано';
        });
      });
      var ns = document.getElementById('noscript-call');
      if (ns) ns.href = href;
    }
  </script>
</body>
</html>
