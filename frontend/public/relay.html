<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Позвонить</title>
  <script>
    // Мгновенный запуск системного набора. Страница открывается через
    // WebApp.openLink() в SFSafariViewController, где tel: НЕ блокируется
    // (в отличие от WebView MiniApp). Пытаемся уйти на tel: сразу, до отрисовки —
    // чтобы над Safari успел всплыть нативный диалог iOS «Позвонить <номер>».
    var params = new URLSearchParams(location.search);
    var phone = params.get('phone');
    var propertyId = params.get('property_id');
    var valid = phone && /^\+?\d[\d\s()\-]{6,20}$/.test(phone);
    var href = valid ? 'tel:' + phone.replace(/[^\d+]/g, '') : '';

    // Глубокий возврат в мини-апп. window.close() в SFSafariViewController
    // молча не работает (relay открыт через WebApp.openLink), поэтому назад
    // ведём универсальной ссылкой t.me: startapp=property_<id> сразу поднимает
    // нужное объявление. Без id — просто в бота.
    var returnHref = 'https://t.me/beldomik_bot' + (propertyId ? '?startapp=property_' + propertyId : '');

    function tryDial() {
      // Несколько способов — какой-нибудь из них Safari отдаст системе.
      try { location.replace(href); } catch (e) {}
      try { window.location.href = href; } catch (e) {}
    }

    // Вернуться в мини-апп: пробуем закрыть контекст, затем открываем t.me.
    // Реальная причина переключателя — window.close() не работает там, где
    // есть SFSafariViewController, и мы возвращаемся deep link'ом в объявление.
    function returnToApp() {
      try { window.close(); } catch (e) {}
      try { location.replace(returnHref); } catch (e) {}
    }

    // Набор + автоматический возврат. Используется и для автозапуска,
    // и для кнопки «Позвонить» (когда iOS требует жест).
    function dialAndClose() {
      tryDial();
      setTimeout(returnToApp, 1200);
    }

    if (valid) {
      tryDial();  // сразу, до body — над Safari всплывает нативный диалог
      document.addEventListener('DOMContentLoaded', function () {
        // Резерв после DOM. Если авто-набор запустился — через 1,5 с уходим
        // в Telegram обратно в объявление. Если пользователь отменил системный
        // вызов — deep link всё равно вернёт его в мини-апп вместо
        // застревания в Safari.
        setTimeout(returnToApp, 1500);
      });
    }
  </script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      font-family: -apple-system, system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      padding: 32px;
      background: #ffffff;
      color: #1a1a1a;
      text-align: center;
    }
    .phone-ico {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: #34c759;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 8px 24px rgba(52, 199, 89, 0.4);
      animation: pulse 1.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .phone-ico svg { width: 30px; height: 30px; }
    .state__text { font-size: 15px; font-weight: 600; color: #3c3c43; }
    .state__number {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 0.01em;
      font-variant-numeric: tabular-nums;
      word-break: break-word;
    }
    .state__btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      height: 54px;
      min-width: 260px;
      max-width: 320px;
      width: 100%;
      border: none;
      border-radius: 16px;
      font-size: 17px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
    }
    .state__btn--call {
      background: #34c759;
      color: #fff;
      box-shadow: 0 6px 18px rgba(52, 199, 89, 0.35);
    }
    .state__btn--copy {
      background: #eef4ff;
      color: #2171ee;
    }
    .state__btn--back {
      background: #f1f5f9;
      color: #2171ee;
    }
    .state__hint { font-size: 13px; color: #8e8e93; }
  </style>
</head>
<body>
  <div class="phone-ico" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/>
    </svg>
  </div>
  <div class="state__number" id="number"></div>
  <a id="call" class="state__btn state__btn--call" href="">📞 Позвонить</a>
  <button id="copy" class="state__btn state__btn--copy" type="button">📋 Скопировать номер</button>
  <button id="back" class="state__btn state__btn--back" type="button">← Вернуться в объявление</button>
  <p class="state__hint" id="hint">После звонка вы вернётесь в объявление автоматически</p>

  <noscript>
    <a href="" id="noscript-call" style="color:#34c759;font-size:20px;font-weight:700">Позвонить</a>
  </noscript>

  <script>
    // Заполняем страницу только для валидного номера. После автозапуска
    // возврат идёт в Telegram по deep link'у (startapp=property_<id>); если
    // авто-возврат не успел — большие кнопки «Позвонить» (набор + возврат) и
    // «Вернуться в объявление» (только возврат) не дадут остаться в Safari.
    if (valid) {
      var number = document.getElementById('number');
      var call = document.getElementById('call');
      var copy = document.getElementById('copy');
      var back = document.getElementById('back');
      var hint = document.getElementById('hint');

      number.textContent = phone;
      call.href = href;
      call.addEventListener('click', dialAndClose);
      copy.addEventListener('click', function () {
        navigator.clipboard.writeText(phone).then(function () {
          copy.textContent = '✓ Скопировано';
        });
      });
      back.addEventListener('click', returnToApp);
      hint.textContent = 'После набора вы вернётесь в Telegram автоматически. Если нет — нажмите «Вернуться в объявление».';

      var ns = document.getElementById('noscript-call');
      if (ns) ns.href = href;
    }
  </script>
</body>
</html>
