[project]
name = "beldomik-backend"
version = "0.1.0"
description = "BELDOMiK - Belarus Real Estate Marketplace Backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.13.1",
    "psycopg[binary,pool]>=3.3.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.6.1",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.12",
    "python-telegram-bot>=21.7",
    "httpx>=0.28.0",
    "redis>=5.2.0",
    "boto3>=1.35.0",
    "python-dotenv>=1.0.1",
    "structlog>=24.4.0",
    "orjson>=3.10.0",
    "email-validator>=2.2.0",
    "phonenumbers>=8.13.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.28.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "types-python-jose>=3.3.0",
    "types-passlib>=1.7.4",
]

[build-system]
requires = ["setuptools>=75.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app", "app.api", "app.api.routes", "app.core", "app.db", "app.models", "app.schemas", "app.services"]

[tool.setuptools.package-dir]
app = "app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "ANN", "ARG", "PTH", "TID", "TRY", "SIM", "ERA", "PD", "RUF", "RET", "ASYNC"]
# B008: FastAPI Depends() в значениях по умолчанию — стандартный паттерн.
# RUF012: мутабельные дефолты допустимы в Pydantic-моделях и Settings.
# TRY003: длинные сообщения в HTTPException — норма для API-ошибок.
ignore = ["ANN101", "ANN102", "ANN201", "ANN202", "ARG001", "ARG002", "B008", "RUF012", "TRY003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S106"]
"alembic/*" = ["S101", "S106"]
# E712: сравнение колонок SQLAlchemy с True/False — требуемый синтаксис ORM.
"app/services/*" = ["E712"]
"app/api/routes/*" = ["E712"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.alembic]
script_location = "alembic"