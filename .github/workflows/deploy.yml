# ============================================================
# CI/CD: Deploy BELDOMiK Backend → Cloud Run (serves API + React SPA)
# Trigger: push to main (any path) OR workflow_dispatch
# Auth: Workload Identity Federation (WIF) - no JSON SA keys
# Secrets: runtime secrets via Secret Manager, 2 GitHub Secrets (WIF only)
# Project: cse-test-project-487807
# Region: europe-west1
# Architecture: Cloud Run serves FastAPI + React static files from /app/frontend/dist
# Frontend is built inside Docker image (multi-stage: Node 22 -> Python 3.13-slim)
# ============================================================

name: Deploy to Production

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  # === Google Cloud =============================================
  GCP_PROJECT_ID: cse-test-project-487807
  GCP_REGION: europe-west1
  # === Artifact Registry ========================================
  AR_REPOSITORY: beldomik-docker
  # === Cloud Run Service ========================================
  SERVICE_NAME: beldomik-backend
  # === Runtime Service Account ==================================
  RUNTIME_SERVICE_ACCOUNT: beldomik-runtime@cse-test-project-487807.iam.gserviceaccount.com
  # === Image reference ==========================================
  IMAGE: europe-west1-docker.pkg.dev/cse-test-project-487807/beldomik-docker/beldomik-backend

jobs:
  # ============================================================
  # BUILD & DEPLOY BACKEND → Cloud Run
  # ============================================================
  deploy-backend:
    name: Build & Deploy Backend to Cloud Run
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write      # Required for Workload Identity Federation

    outputs:
      backend_url: ${{ steps.deploy.outputs.url }}

    steps:
      # === Checkout =============================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # === Authenticate to Google Cloud (WIF) ===================
      - name: Authenticate to Google Cloud (Workload Identity Federation)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WIF_PROVIDER }}
          service_account: ${{ secrets.GCP_WIF_SERVICE_ACCOUNT }}

      # === Cloud SDK Setup ======================================
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          version: '>= 480.0.0'

      # === Configure Docker for Artifact Registry ===============
      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet

      # === Build & Push Docker Image ============================
      # Multi-stage: Node 22 (frontend build) -> Python 3.13-slim (runtime)
      # Context: repository root (Dockerfile at backend/ but we build with -f)
      - name: Build and push Docker image
        run: |
          docker build -f backend/Dockerfile -t "${{ env.IMAGE }}:${{ github.sha }}" .
          docker push "${{ env.IMAGE }}:${{ github.sha }}"

      # === Deploy to Cloud Run ==================================
      # Port 8080 (Dockerfile EXPOSE 8080, Cloud Run injects PORT=8080)
      # min-instances=0 for free tier (cold start, $0 idle)
      # All runtime secrets via --set-secrets (Secret Manager)
      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE_NAME }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          flags: >-
            --port=8080
            --min-instances=0
            --max-instances=2
            --cpu=1
            --memory=512Mi
            --concurrency=80
            --timeout=300s
            --ingress=all
            --allow-unauthenticated
            --service-account=${{ env.RUNTIME_SERVICE_ACCOUNT }}
            --set-env-vars=DEV_MODE=false,ENVIRONMENT=production
            --set-secrets=TELEGRAM_BOT_TOKEN=beldomik-bot-token:latest
            --set-secrets=TELEGRAM_BOT_USERNAME=beldomik-bot-username:latest
            --set-secrets=TELEGRAM_WEBHOOK_SECRET=beldomik-bot-webhook-secret:latest
            --set-secrets=DATABASE_URL=beldomik-database-url:latest
            --set-secrets=FRONTEND_URL=beldomik-frontend-url:latest
            --set-secrets=BACKEND_PUBLIC_URL=beldomik-backend-public-url:latest
            --set-secrets=CHANNEL_URL=beldomik-channel-url:latest
            --set-secrets=S3_ENDPOINT_URL=beldomik-r2-endpoint:latest
            --set-secrets=S3_BUCKET_NAME=beldomik-r2-bucket:latest
            --set-secrets=S3_ACCESS_KEY=beldomik-r2-access-key:latest
            --set-secrets=S3_SECRET_KEY=beldomik-r2-secret-key:latest
            --set-secrets=S3_REGION=beldomik-r2-region:latest
            --set-secrets=S3_PUBLIC_URL=beldomik-r2-public-url:latest
            --set-secrets=SCHEDULER_SECRET=beldomik-scheduler-secret:latest
            --set-secrets=ADMIN_IDS=beldomik-admin-ids:latest

      # === Show deployed URL ====================================
      - name: Show deployed URL
        run: 'echo "Backend deployed to: ${{ steps.deploy.outputs.url }}"'

      # === Cloud Scheduler keep-alive (prevents cold start) =====
      # Free tier: 3 jobs/month/project. One job every 8 min = within limit.
      # Pings /api/internal/scheduler/run which is lightweight.
      - name: Create/Update Cloud Scheduler keep-alive job
        if: success()
        run: |
          set -euo pipefail
          BACKEND_URL="${{ steps.deploy.outputs.url }}"
          if [ -z "$BACKEND_URL" ]; then
            BACKEND_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.GCP_REGION }} --format='value(status.url)')
          fi
          JOB_NAME="beldomik-keepalive"
          SCHEDULE="*/8 * * * *"
          TARGET_URL="${BACKEND_URL}/api/v1/internal/scheduler/run"
          echo "Configuring Cloud Scheduler job ${JOB_NAME} -> ${TARGET_URL} every 8 min"

          # Cloud Scheduler API already enabled (done manually). CI/CD service account
          # lacks serviceusage.services.enable permission — skip enable step.

          # Get SCHEDULER_SECRET from Secret Manager (for header)
          SCHEDULER_SECRET=$(gcloud secrets versions access latest --secret=beldomik-scheduler-secret --project=${{ env.GCP_PROJECT_ID }})

          # Update existing job (created manually — CI lacks cloudscheduler.jobs.create permission)
          if gcloud scheduler jobs describe ${JOB_NAME} --location=${{ env.GCP_REGION }} --project=${{ env.GCP_PROJECT_ID }} >/dev/null 2>&1; then
            echo "Job exists, updating schedule/headers..."
            gcloud scheduler jobs update http ${JOB_NAME} \
              --location=${{ env.GCP_REGION }} \
              --project=${{ env.GCP_PROJECT_ID }} \
              --schedule="${SCHEDULE}" \
              --uri="${TARGET_URL}" \
              --http-method=POST \
              --update-headers="X-Scheduler-Secret=${SCHEDULER_SECRET}" \
              --message-body='{}' \
              --time-zone="Europe/Minsk" \
              --oidc-service-account-email="${{ env.RUNTIME_SERVICE_ACCOUNT }}" \
              --attempt-deadline=30s \
              --quiet
          else
            echo "ERROR: Cloud Scheduler job '${JOB_NAME}' not found. Job must be created manually (CI lacks create permission)."
            exit 1
          fi
        env:
          CLOUDSDK_CORE_PROJECT: ${{ env.GCP_PROJECT_ID }}

  # ============================================================
  # POST-DEPLOY VERIFICATION
  # ============================================================
  verify-deployment:
    name: Verify Deployment Health
    runs-on: ubuntu-latest
    needs: deploy-backend
    permissions:
      contents: read

    steps:
      - name: Wait for service to be ready
        run: sleep 15

      - name: Health check backend
        run: |
          BACKEND_URL="${{ needs.deploy-backend.outputs.backend_url }}"
          echo "Checking ${BACKEND_URL}/api/health"
          for i in {1..12}; do
            if curl -sf "${BACKEND_URL}/api/health" | grep -q '"status":"healthy"'; then
              echo "[OK] Backend health check passed"
              exit 0
            fi
            echo "Attempt $i/12 failed, retrying in 5s..."
            sleep 5
          done
          echo "[FAIL] Backend health check failed after 12 attempts"
          exit 1

      - name: Verify root SPA served
        run: |
          BACKEND_URL="${{ needs.deploy-backend.outputs.backend_url }}"
          echo "Checking ${BACKEND_URL}/ for SPA"
          if curl -sf "${BACKEND_URL}/" | grep -q "BELDOMiK\|<title\|root\|div id"; then
            echo "[OK] Frontend SPA is served"
          else
            echo "[WARN] SPA root check inconclusive"
          fi

  # ============================================================
  # REGISTER TELEGRAM WEBHOOK (after health check passes)
  # BELDOMiK exposes POST /api/v1/webhook/set that registers the
  # webhook against Telegram using BACKEND_PUBLIC_URL + secrets.
  # ============================================================
  register-webhook:
    name: Register Telegram Webhook
    runs-on: ubuntu-latest
    needs: verify-deployment
    permissions:
      contents: read

    steps:
      - name: Register webhook via backend endpoint
        run: |
          BACKEND_URL="${{ needs.deploy-backend.outputs.backend_url }}"
          if [ -z "$BACKEND_URL" ]; then
            echo "Output empty, fetching from gcloud..."
            BACKEND_URL=$(gcloud run services describe ${{ env.SERVICE_NAME }} --region ${{ env.GCP_REGION }} --format='value(status.url)')
          fi
          echo "Registering Telegram webhook via ${BACKEND_URL}/api/v1/webhook/set"
          for i in {1..5}; do
            if curl -sf -X POST "${BACKEND_URL}/api/v1/webhook/set"; then
              echo "[OK] Webhook registration request succeeded"
              exit 0
            fi
            echo "Attempt $i/5 failed, retrying in 5s..."
            sleep 5
          done
          echo "[FAIL] Webhook registration failed after 5 attempts"
          exit 1
